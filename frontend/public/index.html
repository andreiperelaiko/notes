<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M10 4h4M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12M10 11v6M14 11v6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  </svg>

  <header>
    <h1><span aria-hidden="true">📝</span> Заметки <span id="count" class="count"></span></h1>
    <label class="search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr-only">Поиск по заметкам</span>
      <input id="search" type="search" placeholder="Поиск…" autocomplete="off">
    </label>
  </header>

  <form id="form" class="editor" novalidate>
    <label for="title" class="sr-only">Заголовок</label>
    <input id="title" placeholder="Заголовок" maxlength="200" autocomplete="off">
    <label for="content" class="sr-only">Текст заметки</label>
    <textarea id="content" placeholder="Текст заметки…" rows="4"></textarea>
    <p id="error" class="error" role="alert" hidden></p>
    <div class="editor-actions">
      <span class="hint">Ctrl/⌘ + Enter — сохранить</span>
      <button type="button" id="delete" class="btn danger" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Удалить
      </button>
      <button type="button" id="cancel" class="btn ghost" hidden>Отмена</button>
      <button type="submit" id="submit" class="btn primary">Добавить</button>
    </div>
  </form>

  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button type="button" id="retry" class="btn ghost">Повторить</button>
  </div>

  <main id="notes" class="grid" aria-label="Заметки"></main>
  <div id="empty" class="empty" hidden>
    <p id="empty-text"></p>
    <button type="button" id="clear-search" class="btn ghost" hidden>Сбросить поиск</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" id="toast-action" class="toast-action" hidden></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
