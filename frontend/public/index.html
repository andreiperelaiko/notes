<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📝 Заметки <span id="count" class="count"></span></h1>
    <input id="search" type="search" placeholder="Поиск…">
  </header>

  <form id="form" class="editor">
    <input id="title" placeholder="Заголовок" required maxlength="200" autocomplete="off">
    <textarea id="content" placeholder="Текст заметки…" rows="4"></textarea>
    <div class="editor-actions">
      <span class="hint">Ctrl/⌘ + Enter — сохранить</span>
      <button type="button" id="cancel" class="btn ghost" hidden>Отмена</button>
      <button type="submit" id="submit" class="btn primary">Добавить</button>
    </div>
  </form>

  <main id="notes" class="grid"></main>
  <p id="empty" class="empty" hidden>Пока пусто — напишите первую заметку ✨</p>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
