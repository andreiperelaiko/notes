# Несекретная конфигурация (фактор III): порты и адрес бэкенда для nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
  namespace: notes
data:
  PORT: "8000"                       # порт бэкенда
  NGINX_PORT: "80"                   # порт nginx во фронтенде
  BACKEND_URL: "http://backend:8000" # имя Service бэкенда — DNS внутри кластера
---
# Секреты: учётка PostgreSQL и строка подключения для бэкенда.
# Учебные значения; в реальном кластере секреты не хранят в git.
apiVersion: v1
kind: Secret
metadata:
  name: notes-secret
  namespace: notes
type: Opaque
stringData:
  POSTGRES_DB: notes
  POSTGRES_USER: notes
  POSTGRES_PASSWORD: notes-password
  DATABASE_URL: postgresql://notes:notes-password@postgres:5432/notes
