# Фронтенд: nginx отдаёт страницу и проксирует /api на Service backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: notes
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: notes-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef: { name: notes-config } # NGINX_PORT и BACKEND_URL для шаблона nginx
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# NodePort Service: открывает фронтенд снаружи кластера на порту узла 30080.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: notes
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
