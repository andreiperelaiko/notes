# Разовый админ-процесс (фактор XII): создаёт таблицы и завершается.
# Тот же образ и тот же DATABASE_URL, что у бэкенда.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: notes
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres                 # ждём, пока БД начнёт принимать подключения
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: notes-backend:1.0.0
          imagePullPolicy: IfNotPresent           # образ собран локально в minikube
          command: ["python", "migrate.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: notes-secret, key: DATABASE_URL }
